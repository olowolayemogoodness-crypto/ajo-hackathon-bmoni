[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ajo-backend"
version = "0.1.0"
description = "Ajo modular-monolith API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.18.4",
    "fastapi==0.104.1",
    "psycopg[binary]==3.3.1",
    "pydantic-settings==2.1.0",
    "SQLAlchemy==2.0.23",
    "uvicorn==0.24.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.15.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]