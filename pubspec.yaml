name: ajo
description: "Ajo: AI-assisted digital ajo/esusu savings circles."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  intl: ^0.20.3
  google_fonts: ^8.2.1
  dio: ^5.11.1
  flutter_svg: ^2.3.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icons/ajo_full_icon_1024_white.png"
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/ajo_full_icon_1024_white.png"
    background_color: "#F7F6FD"
    theme_color: "#178A55"
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/icons/
    - assets/images/
    - assets/videos/